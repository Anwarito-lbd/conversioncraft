  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Header -->
  <text x="48" y="54" fill="#f8fafc" font-size="26" font-weight="800">ConversionCraft — Growth OS System Architecture &amp; Verified Pipeline</text>
  <text x="48" y="80" fill="#94a3b8" font-size="14">Monorepo: Next.js 16 (Turbopack) + FastAPI 0.5.0 (131 OpenAPI Paths) + Prisma PostgreSQL (12 Models) + Fernet-Encrypted SQLite</text>

  <!-- Verified KPI Badges Row -->
  <g transform="translate(48, 102)">
    <rect width="220" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="220" height="4" rx="2" fill="url(#accentBlue)"/>
    <text x="16" y="28" fill="#94a3b8" font-size="11" font-weight="700">FRONTEND BUILD &amp; LINT</text>
    <text x="16" y="48" fill="#34d399" font-size="16" font-weight="800">11/11 Pages · 0 Errors</text>

    <rect x="240" width="230" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="240" width="230" height="4" rx="2" fill="url(#accentEmerald)"/>
    <text x="256" y="28" fill="#94a3b8" font-size="11" font-weight="700">FASTAPI OPENAPI SURFACE</text>
    <text x="256" y="48" fill="#38bdf8" font-size="16" font-weight="800">131 Paths · 135 Ops</text>

    <rect x="490" width="230" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="490" width="230" height="4" rx="2" fill="url(#accentEmerald)"/>
    <text x="506" y="28" fill="#94a3b8" font-size="11" font-weight="700">WORKER PYTEST SUITE</text>
    <text x="506" y="48" fill="#34d399" font-size="16" font-weight="800">18/18 Passing (CI Strict)</text>

    <rect x="740" width="215" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="740" width="215" height="4" rx="2" fill="url(#accentBlue)"/>
    <text x="756" y="28" fill="#94a3b8" font-size="11" font-weight="700">PRISMA DATA LAYER</text>
    <text x="756" y="48" fill="#a78bfa" font-size="16" font-weight="800">12 Postgres Models</text>

    <rect x="975" width="257" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="975" width="257" height="4" rx="2" fill="url(#accentAmber)"/>
    <text x="991" y="28" fill="#94a3b8" font-size="11" font-weight="700">AI &amp; MEDIA MODELS</text>
    <text x="991" y="48" fill="#fbbf24" font-size="15" font-weight="800">Gemini · Imagen 4 · Veo 3.1</text>
  </g>

  <!-- Column 1: Frontend (apps/web) -->
  <g transform="translate(48, 190)">
    <rect width="340" height="520" rx="16" fill="#0b1222" stroke="#312e81" stroke-width="1.8"/>
    <rect width="340" height="40" rx="16" fill="#1e1b4b"/>
    <text x="20" y="26" fill="#e0e7ff" font-size="14" font-weight="800">1. Frontend · apps/web (Next.js 16)</text>

    <rect x="20" y="60" width="300" height="110" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="84" fill="#818cf8" font-size="12" font-weight="700">Public &amp; Discovery Routes</text>
    <text x="34" y="106" fill="#e2e8f0" font-size="12">• / — Marketing Landing + ChatBot</text>
    <text x="34" y="126" fill="#e2e8f0" font-size="12">• /login — Workspace Auth &amp; Register</text>
    <text x="34" y="146" fill="#e2e8f0" font-size="12">• /finder — Product Finder Pro + Compare</text>

    <rect x="20" y="186" width="300" height="130" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="210" fill="#38bdf8" font-size="12" font-weight="700">Protected Growth OS Routes</text>
    <text x="34" y="232" fill="#e2e8f0" font-size="12">• /os — War Room &amp; Copilot Workspace</text>
    <text x="34" y="252" fill="#e2e8f0" font-size="12">• /onboarding — Versioned Setup Flow</text>
    <text x="34" y="272" fill="#e2e8f0" font-size="12">• /studio — Creative Kanban (409 Guard)</text>
    <text x="34" y="292" fill="#e2e8f0" font-size="12">• /dashboard — ROAS, SLA &amp; Kill-Switches</text>

    <rect x="20" y="332" width="300" height="168" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="356" fill="#34d399" font-size="12" font-weight="700">Client AI &amp; 3D Visualization</text>
    <text x="34" y="378" fill="#cbd5e1" font-size="12">• @google/genai (^1.30.0)</text>
    <text x="34" y="398" fill="#94a3b8" font-size="11">  gemini-3-pro-preview · gemini-2.5-flash</text>
    <text x="34" y="416" fill="#94a3b8" font-size="11">  imagen-4.0 · veo-3.1-fast-generate</text>
    <text x="34" y="440" fill="#cbd5e1" font-size="12">• @react-three/fiber + three + drei</text>
    <text x="34" y="460" fill="#cbd5e1" font-size="12">• Recharts + Framer Motion + Tailwind v4</text>
    <text x="34" y="480" fill="#cbd5e1" font-size="12">• SessionControls (Org Switch &amp; Bearer)</text>
  </g>

  <!-- Arrow Web -> Worker -->
  <line x1="388" y1="350" x2="438" y2="350" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <text x="394" y="336" fill="#22d3ee" font-size="10" font-weight="700">Bearer</text>

  <!-- Column 2: Worker (apps/worker) -->
  <g transform="translate(442, 190)">
    <rect width="380" height="520" rx="16" fill="#0b1222" stroke="#0e7490" stroke-width="1.8"/>
    <rect width="380" height="40" rx="16" fill="#083344"/>
    <text x="20" y="26" fill="#cffafe" font-size="14" font-weight="800">2. Backend Worker · apps/worker (FastAPI 0.5.0)</text>

    <rect x="20" y="60" width="340" height="100" rx="10" fill="#111827" stroke="#0891b2"/>
    <text x="34" y="84" fill="#22d3ee" font-size="12" font-weight="700">Middleware &amp; Multi-Tenant RBAC</text>
    <text x="34" y="106" fill="#e2e8f0" font-size="12">• inject_session_context (401 on /api/* w/o Bearer)</text>
    <text x="34" y="126" fill="#e2e8f0" font-size="12">• Rate Limiter · Idempotency · Audit Logger</text>
    <text x="34" y="146" fill="#e2e8f0" font-size="12">• Org RBAC (owner/admin/marketer/analyst/viewer)</text>

    <rect x="20" y="176" width="340" height="174" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="200" fill="#38bdf8" font-size="12" font-weight="700">Domain APIs (131 Paths / 135 Operations)</text>
    <text x="34" y="222" fill="#e2e8f0" font-size="12">• /api/auth/* — Register, Login, Switch-Org, Logout</text>
    <text x="34" y="242" fill="#e2e8f0" font-size="12">• /api/analyze · /api/sourcing/cj/* · /api/fulfillment/*</text>
    <text x="34" y="262" fill="#e2e8f0" font-size="12">• /api/copy/* · /api/creatives/* · /api/offers/*</text>
    <text x="34" y="282" fill="#e2e8f0" font-size="12">• /api/campaigns/* · /api/experiments/* · /api/analytics/*</text>
    <text x="34" y="302" fill="#e2e8f0" font-size="12">• /api/alerts/* · /api/sla/* (Line-Level JSON Hints)</text>
    <text x="34" y="322" fill="#fbbf24" font-size="12">• /api/ops/controls — Kill-Switches &amp; Action Caps</text>
    <text x="34" y="340" fill="#94a3b8" font-size="11">• Optimistic Locking (409 version_conflict)</text>

    <rect x="20" y="366" width="340" height="134" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="390" fill="#a78bfa" font-size="12" font-weight="700">Agents &amp; Background Scheduler</text>
    <text x="34" y="412" fill="#e2e8f0" font-size="12">• Agents: Copywriter · Director · Producer · 3D Model</text>
    <text x="34" y="432" fill="#e2e8f0" font-size="12">• APScheduler Lifespan Loop:</text>
    <text x="34" y="452" fill="#94a3b8" font-size="11">  - Automated Campaign Optimizer Executor</text>
    <text x="34" y="470" fill="#94a3b8" font-size="11">  - OAuth Token Rotation &amp; Dead-Letter Queue</text>
    <text x="34" y="488" fill="#94a3b8" font-size="11">  - Synced Schema: docs/openapi.json</text>
  </g>

  <!-- Arrow Worker -> Persistence & Adapters -->
  <line x1="822" y1="300" x2="872" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="822" y1="530" x2="872" y2="530" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 3: Persistence & External Adapters -->
  <g transform="translate(876, 190)">
    <rect width="356" height="240" rx="16" fill="#0b1222" stroke="#065f46" stroke-width="1.8"/>
    <rect width="356" height="40" rx="16" fill="#064e3b"/>
    <text x="20" y="26" fill="#d1fae5" font-size="14" font-weight="800">3. Persistence &amp; Security</text>

    <rect x="20" y="58" width="316" height="74" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="80" fill="#34d399" font-size="12" font-weight="700">PostgreSQL + Prisma (12 Models)</text>
    <text x="34" y="100" fill="#cbd5e1" font-size="11">User · Organization · OrgMember · OAuthToken</text>
    <text x="34" y="118" fill="#cbd5e1" font-size="11">Campaign · Experiment · Attribution · AuditLog</text>

    <rect x="20" y="144" width="316" height="78" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="166" fill="#fbbf24" font-size="12" font-weight="700">Encrypted SQLite + Redis</text>
    <text x="34" y="186" fill="#cbd5e1" font-size="11">secure_store.db (Fernet AES-128-CBC + HMAC)</text>
    <text x="34" y="204" fill="#cbd5e1" font-size="11">PBKDF2-SHA256 Passwords · docker-compose Redis</text>
  </g>

  <g transform="translate(876, 448)">
    <rect width="356" height="262" rx="16" fill="#0b1222" stroke="#7c2d12" stroke-width="1.8"/>
    <rect width="356" height="40" rx="16" fill="#431407"/>
    <text x="20" y="26" fill="#ffedd5" font-size="14" font-weight="800">4. Live + Mock-Capable Adapters</text>

    <rect x="20" y="58" width="316" height="60" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="80" fill="#fb923c" font-size="12" font-weight="700">Commerce, Ads &amp; Billing</text>
    <text x="34" y="100" fill="#cbd5e1" font-size="11">Shopify · Meta Ads · TikTok Ads · Stripe · UpCart</text>

    <rect x="20" y="128" width="316" height="58" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="150" fill="#f472b6" font-size="12" font-weight="700">AI Copy, 3D &amp; UGC Video</text>
    <text x="34" y="170" fill="#cbd5e1" font-size="11">DeepSeek · TripoSR · Creatify · Flair · Higgsfield</text>

    <rect x="20" y="196" width="316" height="50" rx="10" fill="#111827" stroke="#334155"/>
    <text x="34" y="218" fill="#38bdf8" font-size="12" font-weight="700">Sourcing, Fulfillment &amp; CRM</text>
    <text x="34" y="236" fill="#cbd5e1" font-size="11">CJ Dropshipping · AutoDS · Mailchimp · Manus</text>
  </g>
</svg>
